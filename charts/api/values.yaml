replicaCount: 1

image:
  repository: ghcr.io/jtoniolo/rv-checklist-api
  # Leave empty. The chart resolves its own image from `appVersion` in
  # Chart.yaml, so the chart and the image it deploys can never disagree.
  # Override only to pin a `sha-<short>` build while debugging.
  tag: ""
  # Safe because published tags are immutable — every publish is a distinct
  # `X.Y.Z`, so there is never a stale cached layer under the same name.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret environment variables (rendered into a ConfigMap).
#
# PORT is deliberately absent: `containerPort` is a fixed 3000 and the Service
# resolves `targetPort: http` through it, so a configurable listen port would
# only ever point the Service at a dead port. A per-pod port is meaningless in
# Kubernetes anyway — every pod has its own IP. The app's own default applies.
config:
  # Required — rendering fails without it, and fails on a localhost value. The
  # deployed web origin (example: https://rv.example.com). It is the only origin
  # CORS lets call the API, so the chart refuses to ship the dev default.
  WEB_ORIGIN: ""
  # Required — rendering fails without it. Common parent domain of the web host
  # and the API host (example: .rv.example.com), so both receive the httpOnly
  # auth cookies (ADR-0019); setting it also marks them Secure. Not a secret.
  COOKIE_DOMAIN: ""
  # Required — rendering fails without it. Not a secret: the web app ships this
  # same id to the browser. The matching client secret IS in the system since
  # v0.2.9 (the MCP OAuth server exchanges authorization codes with Google);
  # it lives in existingSecret as GOOGLE_CLIENT_SECRET.
  GOOGLE_CLIENT_ID: ""
  # Required — rendering fails without it. The API's own public origin with
  # no path component (example: https://api.example.com). MCP OAuth discovery
  # publishes absolute URLs built from it, and the API serves those routes —
  # so this is the API's host, not the web app's. Left unset, the app falls
  # back to http://localhost:3000 and MCP OAuth silently breaks.
  MCP_ISSUER_URL: ""
  JWT_ACCESS_TTL: "900"
  REFRESH_TTL_DAYS: "180"
  # Reuse interval in seconds for a rotated-out refresh token (ADR-0028): a
  # replay inside this window still refreshes, so a rotation response lost on
  # an unreliable network self-heals instead of ending the session.
  REFRESH_REUSE_INTERVAL_SECONDS: "120"
  # Required — rendering fails without it. Garage S3 endpoint for attachment
  # storage (ADR-0026). Garage runs on the home lab host, outside the cluster
  # (http://<garage-host>:3900). Not a secret — it is unreachable without the key
  # pair in existingSecret.
  S3_ENDPOINT: ""
  # Required — rendering fails without it. The app's single attachment bucket
  # (ADR-0026): `rv-checklist` in production.
  S3_BUCKET: ""
  # Public origin browsers reach the PowerSync sync service at (ADR-0028).
  # GET /auth/powersync-token hands it to clients, so when powersync.enabled
  # this must be the externally reachable URL the deployer routes to the
  # powersync Service (port 8080) — rendering fails if it is still localhost.
  # The default only applies while powersync is off.
  POWERSYNC_URL: "http://localhost:8080"

# Name of a pre-existing Secret. The chart does not create a Secret — the
# cluster materialises one (e.g. via HashiCorp Vault) and you reference it here.
#
# It must supply exactly these eight keys (plus two more when
# powersync.enabled — see the powersync section below):
#   JWT_SECRET           — signing key for the first-party access JWT (long
#                          and random)
#   MCP_JWT_SECRET       — signing key for MCP OAuth JWTs (v0.2.9+), at least
#                          32 characters. Separate from JWT_SECRET so rotating
#                          one does not invalidate the other's tokens.
#   GOOGLE_CLIENT_SECRET — client secret of the Google OAuth client (v0.2.9+).
#                          From Google Cloud Console → Credentials.
#   DATABASE_URL         — the whole Postgres connection string, not discrete
#                          fields
#   GOOGLE_MAPS_API_KEY  — Google Maps Platform API key for leg-distance
#                          fetches (ADR-0025). Scoped to Routes API + Places
#                          API (New); daily quotas capped in the free tier.
#   S3_ACCESS_KEY_ID     — Garage key id for the attachment bucket (ADR-0026,
#                          provisioned by ticket #110). In Vault (KV path in
#                          the operator's private deployment config) as
#                          `s3_access_key_id`.
#   S3_SECRET_ACCESS_KEY — Garage secret key paired with S3_ACCESS_KEY_ID.
#                          In Vault, same KV path, as
#                          `s3_access_key` — NOT `s3_secret_access_key`; the
#                          Vault key name differs from the env var name.
#   POWERSYNC_JWT_SECRET — shared HS256 key for PowerSync client JWTs
#                          (ADR-0028), base64url-encoded (A-Za-z0-9_-, 43+
#                          chars). The API signs with its decoded bytes; the
#                          sync service verifies with the same string as the
#                          `k` of an inline JWKS key. Required by the API even
#                          when powersync.enabled is false.
#
# The Deployment injects the Secret with `envFrom`, so new keys added to the
# Secret reach the pod without any chart change.
#
# Rotating that Secret does not restart the pods, and cannot: a chart can only
# hash what it renders itself. Rolling on rotation is the consumer's job — with
# Vault Secrets Operator, point `rolloutRestartTargets` at this Deployment.
# Required — rendering fails without it.
existingSecret: ""

# Keys the chart requires in existingSecret — the chart's half of the secret
# contract. Rendered as explicit `secretKeyRef` env entries alongside the
# `envFrom` injection, so a Secret missing one of these fails pod creation
# with an event naming the key, instead of an app stack trace mid-startup.
# The api's env-chart contract test (apps/api/src/app/config/
# env-chart-contract.spec.ts) checks that every env var EnvSchema requires
# appears either under `config` above or in this list.
secretKeys:
  - JWT_SECRET
  - MCP_JWT_SECRET
  - GOOGLE_CLIENT_SECRET
  - DATABASE_URL
  - GOOGLE_MAPS_API_KEY
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - POWERSYNC_JWT_SECRET

service:
  type: ClusterIP
  port: 3000

# PowerSync sync service (issue #145, ADR-0028): a second Deployment in this
# release that streams the `powersync` publication (created by the API's
# migrations) into per-client SQLite, with Postgres bucket storage — no
# MongoDB. Off by default; the API runs fine without it.
#
# When enabled, existingSecret must also supply:
#   POWERSYNC_DATA_SOURCE_URI — Postgres connection string the service
#                          replicates from: the app database, as a role with
#                          REPLICATION and SELECT on the ten published tables
#                          (see docs/deployment.md for the role SQL).
#   POWERSYNC_STORAGE_URI  — Postgres connection string for sync bucket
#                          storage: a separate database (same server is fine
#                          on Postgres 14+) owned by a dedicated role; the
#                          service creates its own schema there.
# The sync rules ship in this chart (files/sync-rules.yaml → ConfigMap); kid
# and audience for client JWTs are pinned to `powersync` to match the API.
powersync:
  enabled: false
  image:
    repository: journeyapps/powersync-service
    # Postgres bucket storage needs >= 1.3.8.
    tag: "1.24.0"
    pullPolicy: IfNotPresent
  # sslmode for both Postgres connections: verify-full, verify-ca, or disable.
  sslmode: verify-full
  # Daily bucket compact (PowerSync recommends one); standard cron syntax.
  compactSchedule: "0 2 * * *"
  # PowerSync sizing guidance: ~1 GB / 1 vCPU. The compact CronJob reuses
  # these. The pods set NODE_OPTIONS so the Node heap tracks the limit.
  resources: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
