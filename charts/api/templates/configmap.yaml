{{- if not .Values.config.GOOGLE_CLIENT_ID }}
{{- fail "config.GOOGLE_CLIENT_ID is required. Set it to the Google OAuth client id this API verifies One Tap ID tokens against — the same id the web app ships to the browser. It is not a secret, so it belongs here and not in existingSecret. Left empty, the API fails its own env validation and CrashLoops." }}
{{- end }}
{{- if not .Values.config.MCP_ISSUER_URL }}
{{- fail "config.MCP_ISSUER_URL is required since v0.2.9. Set it to the API's public origin with no path component (usually the same value as WEB_ORIGIN). Left empty, the app falls back to http://localhost:3000 and MCP OAuth silently breaks." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rv-checklist-api.fullname" . }}
  labels:
    {{- include "rv-checklist-api.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
