# Local dev infrastructure (issue #13). Brings up the Postgres the API connects
# to; the app runs TypeORM migrations against it at startup. This is a
# deploy-time concern's local stand-in only — production Postgres lives in the
# cluster (ADR-0001), not here.
#
#   docker compose -f tools/dev/docker-compose.yml up -d
#
# Credentials match DATABASE_URL in .env.example.
#
# `name` pins the Compose project so it never collides with another project that
# happens to live in a `dev/` directory.
name: rv-checklist

services:
  postgres:
    image: postgres:16-alpine
    container_name: rv-checklist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rv
      POSTGRES_PASSWORD: rv
      POSTGRES_DB: rv_checklist
    ports:
      - '5432:5432'
    volumes:
      - rv-checklist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rv -d rv_checklist']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rv-checklist-pgdata:
