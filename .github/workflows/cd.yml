# CD (#47, #48) — publish the API image and Helm chart to GHCR for one release.
#
# A release is a git tag. Bump `version`/`appVersion` in charts/api/Chart.yaml,
# commit, tag `vX.Y.Z`, then dispatch this workflow against that tag:
# Actions → CD → Run workflow → Tags → vX.Y.Z.
#
# The version comes from the tag, never from a run number, so every published
# artifact traces back to a commit and `git checkout vX.Y.Z && helm package
# charts/api` reproduces the published chart byte for byte.
#
# Uses the built-in GITHUB_TOKEN with packages:write — no extra secrets.
name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jtoniolo/rv-checklist-api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails before anything is published, so a bad dispatch leaves no trace
      # in the registry.
      - name: Resolve version from the tag
        id: version
        # The ref reaches the shell through env, never through `${{ }}`
        # interpolation — expressions are substituted before bash parses the
        # script, so a tag name carrying shell metacharacters would otherwise
        # run as code. GITHUB_REF_NAME/GITHUB_SHA are supplied by Actions.
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::CD must be dispatched against a tag, not the ${REF_TYPE} '${GITHUB_REF_NAME}'. Cut a vX.Y.Z tag and pick it under Run workflow → Tags."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '/^version:/ {print $2}' charts/api/Chart.yaml | tr -d '"')"
          chart_app_version="$(awk '/^appVersion:/ {print $2}' charts/api/Chart.yaml | tr -d '"')"

          if [ "$version" != "$chart_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} means version ${version}, but charts/api/Chart.yaml has version ${chart_version}. The tag was cut without the version bump."
            exit 1
          fi

          # appVersion is what the Deployment resolves its image tag from, so a
          # drift here would publish a chart that pulls a different image.
          if [ "$version" != "$chart_app_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} means version ${version}, but charts/api/Chart.yaml has appVersion ${chart_app_version}. The chart would deploy an image other than the one this run builds."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Docker image ----
      # :X.Y.Z is what the chart pulls and is never overwritten. :sha-<short>
      # pins the exact commit. :latest is a human convenience only — nothing in
      # the chart reads it.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

      # ---- Helm chart ----
      - name: Install Helm
        uses: azure/setup-helm@v4

      # No --version/--app-version: the version is committed state in
      # Chart.yaml, already checked against the tag above.
      - name: Package chart
        run: helm package charts/api --destination .helm-out

      - name: Push chart to GHCR
        run: |
          helm push \
            ".helm-out/rv-checklist-api-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/jtoniolo/charts
